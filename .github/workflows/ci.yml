name: CI
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Python 3.12 + deps
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --upgrade -r requirements.txt packaging

      # Install Flutter 3.27.4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable

      - uses: android-actions/setup-android@v3
        with:
          components: |
            platform-tools
            build-tools;34.0.0
            platforms;android-34
            cmdline-tools;latest

      # Seed SDK for Flet & PATH
      - name: Seed SDK for Flet & PATH
        run: |
          mkdir -p ~/.flet/flutter
          ln -s "$HOME/flutter" ~/.flet/flutter/3.27.4-stable || true
          echo '3.27.4-stable' > ~/.flet/flutter/version
          echo "FLUTTER_ROOT=$HOME/flutter"  >> $GITHUB_ENV
          echo "PATH=$HOME/flutter/bin:$PATH" >> $GITHUB_ENV

      # Mirror env (jaga-jaga pub/grpc)
      - run: |
          echo "PUB_HOSTED_URL=https://pub.flutter-io.cn" >> $GITHUB_ENV
          echo "FLUTTER_STORAGE_BASE_URL=https://storage.flutter-io.cn" >> $GITHUB_ENV

      # Lint & unit-test
      - run: ruff check .
      - run: pytest -q

      # Build APK (offline)
      - name: Build APK (offline)
        run: bash scripts/build_apk.sh

      # Upload artefak
      - uses: actions/upload-artifact@v4
        with:
          name: ErgoMotion-debug-apk
          path: build/**/outputs/apk/debug/*.apk
